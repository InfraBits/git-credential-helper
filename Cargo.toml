[package]
name = "git-credential-helper"
version = "0.1.0"
edition = "2021"
description = "Git credential helper for GitHub App and static credentials"
license = "MIT"
publish = false
authors = ["Infrabits"]

[package.metadata.deb]
name = "git-credential-helper"
maintainer = "Infrabits"
copyright = "Infrabits"
assets = [
  ["target/release/git-credential-helper", "usr/sbin/git-credential-helper", "755"],
]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
jsonwebtoken = "9"
anyhow = "1"
nix = { version = "0.29", features = ["user"] }

[profile.release]
strip = true

[dev-dependencies]
tempfile = "3"
