name: Build
on:
  push:
    tags: ['v*']
concurrency:
  group: release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: x86_64-unknown-linux-musl
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cross,cargo-deb
      - name: Build
        run: cross build --release --target x86_64-unknown-linux-musl
        env:
          BUILD_VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: git-credential-helper
          path: target/x86_64-unknown-linux-musl/release/git-credential-helper

  create-release:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Create GitHub release
        uses: infrabits/ci-create-missing-release@73b7177537a8878ba996e3bf8ce447a784db05f2 # v1.7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          artifacts: git-credential-helper

  ppa-upload:
    runs-on: ubuntu-latest
    needs: [build, create-release]
    strategy:
      fail-fast: false
      matrix:
        distribution: [resolute]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install packaging tools
        run: sudo apt-get install -y --no-install-recommends devscripts debhelper libdistro-info-perl dput
      - name: Import GPG key
        run: gpg --batch --import <<< "$GPG_PRIVATE_KEY"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Download binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: git-credential-helper
      - name: Setup source structure
        run: |
          mkdir -p ${{ runner.temp }}/package/
          cp -r debian ${{ runner.temp }}/package/
          cp git-credential-helper ${{ runner.temp }}/package/
      - name: Generate changelog
        env:
          DEBEMAIL: info@infrabits.nl
          DEBFULLNAME: InfraBits
        run: |
          dch --create \
            --package git-credential-helper \
            --newversion $(sed -e 's/^v//' <<< "${{ github.ref_name }}~${{ matrix.distribution }}1") \
            --distribution ${{ matrix.distribution }} \
            --urgency low \
            "Release ${{ github.ref_name }}"
        working-directory: ${{ runner.temp }}/package/
      - name: Build source package
        run: |
          debuild -S -sa -d -k"${{ secrets.GPG_KEY_ID }}"
        working-directory: ${{ runner.temp }}/package/
      - name: Upload to PPA
        run: dput ppa:damianzaremba/infrabits git-credential-helper_*_source.changes
        working-directory: ${{ runner.temp }}
