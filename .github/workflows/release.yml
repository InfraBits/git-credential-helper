name: Build
on:
  push:
    tags: ['v*']
concurrency:
  group: release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: x86_64-unknown-linux-musl
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cross,cargo-deb
      - name: Build
        run: cross build --release --target x86_64-unknown-linux-musl
        env:
          BUILD_VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: git-credential-helper
          path: target/x86_64-unknown-linux-musl/release/git-credential-helper

  create-release:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Create GitHub release
        uses: infrabits/ci-create-missing-release@9be5b1cb5cae1e62c560c6a1efde7172f2688817 # v1.6.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          artifacts: git-credential-helper

  ppa-upload:
    runs-on: ubuntu-latest
    needs: [build, create-release]
    strategy:
      fail-fast: false
      matrix:
        distribution: [noble, resolute]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install packaging tools
        run: sudo apt-get install -y --no-install-recommends devscripts debhelper libdistro-info-perl dput
      - name: Import GPG key
        run: gpg --batch --import <<< "$GPG_PRIVATE_KEY"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Download binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: git-credential-helper
      - name: Setup source structure
        run: |
          mkdir -p ${{ runner.temp }}/package/
          cp -r debian ${{ runner.temp }}/package/
          cp git-credential-helper ${{ runner.temp }}/package/
      - name: Generate changelog
        env:
          DEBEMAIL: info@infrabits.nl
          DEBFULLNAME: InfraBits
        run: |
          dch --create \
            --package git-credential-helper \
            --newversion $(sed -e 's/^v//' <<< "${{ github.ref_name }}~${{ matrix.distribution }}1") \
            --distribution ${{ matrix.distribution }} \
            --urgency low \
            "Release ${{ github.ref_name }}"
        working-directory: ${{ runner.temp }}/package/
      - name: Build source package
        run: |
          debuild -S -sa -d -k"${{ secrets.GPG_KEY_ID }}"
        working-directory: ${{ runner.temp }}/package/
      - name: Upload to PPA
        run: dput ppa:damianzaremba/infrabits git-credential-helper_*_source.changes
        working-directory: ${{ runner.temp }}
